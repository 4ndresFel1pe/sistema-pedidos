<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Artículos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f9f9f9;
    }
    h2 {
      color: #333;
    }
    form {
      margin-bottom: 20px;
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    input, button {
      margin: 5px;
      padding: 7px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    table, th, td {
      border: 1px solid #ccc;
    }
    th, td {
      padding: 10px;
      text-align: center;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 4px;
    }
    .editar {
      background: #ff9800;
      color: white;
    }
    .eliminar {
      background: #f44336;
      color: white;
    }
    .guardar {
      background: #4caf50;
      color: white;
    }
  </style>
</head>
<body>

  <h2>Gestión de Artículos</h2>

  <form id="formArticulo">
    <input type="number" id="id" placeholder="ID" required>
    <input type="text" id="cliente" placeholder="Cliente" required>
    <input type="text" id="producto" placeholder="Producto" required>
    <input type="number" id="cantidad" placeholder="Cantidad" required>
    <input type="number" step="0.01" id="precio" placeholder="Precio" required>
    <input type="date" id="fecha" required>
    <button type="submit" class="guardar">Guardar</button>
  </form>

  <table id="tablaArticulos">
    <thead>
      <tr>
        <th>ID</th>
        <th>Cliente</th>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Precio</th>
        <th>Fecha</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    let articulos = [];
    let editando = null;

    const form = document.getElementById("formArticulo");
    const tabla = document.getElementById("tablaArticulos").querySelector("tbody");

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      const nuevoArticulo = {
        id: document.getElementById("id").value,
        cliente: document.getElementById("cliente").value,
        producto: document.getElementById("producto").value,
        cantidad: document.getElementById("cantidad").value,
        precio: document.getElementById("precio").value,
        fecha: document.getElementById("fecha").value
      };

      if (editando !== null) {
        articulos[editando] = nuevoArticulo;
        editando = null;
      } else {
        articulos.push(nuevoArticulo);
      }

      form.reset();
      mostrarArticulos();
    });

    function mostrarArticulos() {
      tabla.innerHTML = "";
      articulos.forEach((articulo, index) => {
        const fila = document.createElement("tr");

        fila.innerHTML = `
          <td>${articulo.id}</td>
          <td>${articulo.cliente}</td>
          <td>${articulo.producto}</td>
          <td>${articulo.cantidad}</td>
          <td>${articulo.precio}</td>
          <td>${articulo.fecha}</td>
          <td>
            <button class="editar" onclick="editarArticulo(${index})">Editar</button>
            <button class="eliminar" onclick="eliminarArticulo(${index})">Eliminar</button>
          </td>
        `;

        tabla.appendChild(fila);
      });
    }

    window.editarArticulo = function(index) {
      const articulo = articulos[index];
      document.getElementById("id").value = articulo.id;
      document.getElementById("cliente").value = articulo.cliente;
      document.getElementById("producto").value = articulo.producto;
      document.getElementById("cantidad").value = articulo.cantidad;
      document.getElementById("precio").value = articulo.precio;
      document.getElementById("fecha").value = articulo.fecha;

      editando = index;
    };

    window.eliminarArticulo = function(index) {
      articulos.splice(index, 1);
      mostrarArticulos();
    };
  </script>

</body>
</html>
