<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listaa de Pedidos</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background:#f5f5f5; }
  h1 { color: #ff7518; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; border-radius:10px; overflow:hidden;}
  th, td { border: 1px solid #ddd; padding: 10px; text-align:center; }
  th { background: #ff7518; color: #fff; }
  button { padding:5px 10px; margin:2px; border:none; border-radius:5px; cursor:pointer; }
  .btn-add { background: #28a745; color:#fff; }
  .btn-edit { background:#ffc107; color:#000; }
  .btn-delete { background:#dc3545; color:#fff; }
  .form-container { background:#fff; padding:20px; border-radius:10px; margin-top:20px; }
  .form-container input { padding:6px; margin:5px 0; width:100%; border-radius:5px; border:1px solid #ccc; }
</style>
</head>
<body>

<h1>Lista de Pedidos</h1>

<div class="form-container">
  <h3>Crear / Editar Pedido</h3>
  <form id="pedidoForm">
  <input type="hidden" id="pedidoId" name="id">
  <label>Cliente:</label>
  <input type="text" id="cliente" name="cliente" required>
  <label>Producto:</label>
  <input type="text" id="producto" name="producto" required>
  <label>Cantidad:</label>
  <input type="number" id="cantidad" name="cantidad" min="1" required>
  <label>Precio:</label>
  <input type="number" id="precio" name="precio" min="0" step="0.01" required>
  <label>Fecha:</label>
  <input type="date" id="fecha" name="fecha" required>
  <button type="submit" class="btn-add" id="btnGuardar">Guardar Pedido</button>
</form>

</div>

<table id="tablaPedidos">
  <thead>
    <tr>
      <th>ID</th>
      <th>Cliente</th>
      <th>Producto</th>
      <th>Cantidad</th>
      <th>Precio</th>
      <th>Fecha</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    <!-- Pedidos se insertan aquí -->
  </tbody>
</table>

<script>
const form = document.getElementById('pedidoForm');
const tabla = document.getElementById('tablaPedidos').querySelector('tbody');

// 🚀 Cargar pedidos desde la base de datos
async function cargarPedidos() {
  const res = await fetch('../backend/pedidos.php?read');
  const data = await res.json();
  renderTabla(data);
}

// 🚀 Mostrar pedidos en la tabla
function renderTabla(pedidos) {
  tabla.innerHTML = '';
  pedidos.forEach(p => {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${p.id}</td>
      <td>${p.cliente}</td>
      <td>${p.producto}</td>
      <td>${p.cantidad}</td>
      <td>${parseFloat(p.precio).toFixed(2)}</td>
      <td>${p.fecha}</td>
      <td>
        <button class="btn-edit" onclick="editarPedido(${p.id}, '${p.cliente}', '${p.producto}', ${p.cantidad}, ${p.precio}, '${p.fecha}')">Editar</button>
        <button class="btn-delete" onclick="eliminarPedido(${p.id})">Eliminar</button>
      </td>
    `;
    tabla.appendChild(row);
  });
}

// 🚀 Guardar (crear o actualizar)
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('pedidoId').value;
  const formData = new FormData(form);
  
  if (id) {
    formData.append('update', true);
    formData.append('id', id);
  } else {
    formData.append('create', true);
  }

  await fetch('../backend/pedidos.php', { method: 'POST', body: formData });
  form.reset();
  document.getElementById('pedidoId').value = '';
  document.getElementById('btnGuardar').textContent = 'Guardar Pedido';
  cargarPedidos();
});

// 🚀 Eliminar
async function eliminarPedido(id) {
  if (confirm("¿Eliminar este pedido?")) {
    const formData = new FormData();
    formData.append('delete', true);
    formData.append('id', id);
    await fetch('../backend/pedidos.php', { method: 'POST', body: formData });
    cargarPedidos();
  }
}

// 🚀 Editar
function editarPedido(id, cliente, producto, cantidad, precio, fecha) {
  document.getElementById('pedidoId').value = id;
  document.getElementById('cliente').value = cliente;
  document.getElementById('producto').value = producto;
  document.getElementById('cantidad').value = cantidad;
  document.getElementById('precio').value = precio;
  document.getElementById('fecha').value = fecha;
  document.getElementById('btnGuardar').textContent = 'Actualizar Pedido';
}

// 🚀 Inicial
cargarPedidos();
</script>
</body>
</html>
