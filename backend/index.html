<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CRUD Pedido</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        nav {
            margin-bottom: 20px;
        }
        nav button {
            margin-right: 10px;
            padding: 10px;
        }
        section {
            display: none;
        }
        section.active {
            display: block;
        }
        form input, form button {
            margin: 5px 0;
            display: block;
        }
    </style>
    <script>
        function showSection(id) {
            document.querySelectorAll("section").forEach(sec => sec.classList.remove("active"));
            document.getElementById(id).classList.add("active");
        }
    </script>
</head>
<body>

    <h1>CRUD de Pedidos</h1>
    <nav>
        <button onclick="showSection('create')">Agregar</button>
        <button onclick="showSection('read')">Ver</button>
        <button onclick="showSection('update')">Actualizar</button>
        <button onclick="showSection('delete')">Eliminar</button>
    </nav>

    <!-- CREATE -->
    <section id="create" class="active">
        <h2>Agregar Pedido</h2>
        <form action="pedidos.php" method="POST">
            <input type="text" name="cliente" placeholder="Cliente" required>
            <input type="text" name="producto" placeholder="Producto" required>
            <input type="number" name="cantidad" placeholder="Cantidad" required>
            <input type="number" step="0.01" name="precio" placeholder="Precio" required>
            <input type="date" name="fecha" required>
            <button type="submit" name="create">Agregar</button>
        </form>
    </section>

    <!-- READ -->
    <section id="read">
        <h2>Lista de Pedidos</h2>
        <p><a href="pedidos.php?read" target="_blank">Ver todos los pedidos</a></p>
    </section>

    <!-- UPDATE -->
    <section id="update">
        <h2>Actualizar Pedido</h2>
        <form action="pedidos.php" method="POST">
            <input type="number" name="id" placeholder="ID del pedido" required>
            <input type="text" name="cliente" placeholder="Nuevo cliente" required>
            <input type="text" name="producto" placeholder="Nuevo producto" required>
            <input type="number" name="cantidad" placeholder="Nueva cantidad" required>
            <input type="number" step="0.01" name="precio" placeholder="Nuevo precio" required>
            <input type="date" name="fecha" required>
            <button type="submit" name="update">Actualizar</button>
        </form>
    </section>

    <!-- DELETE -->
    <section id="delete">
        <h2>Eliminar Pedido</h2>
        <form action="pedidos.php" method="POST">
            <input type="number" name="id" placeholder="ID del pedido" required>
            <button type="submit" name="delete">Eliminar</button>
        </form>
    </section>

</body>
</html>
